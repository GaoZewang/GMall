openapi: 3.0.0
info:
  title: 店铺管理API
  description: 店铺管理相关接口，包括店铺的增删改查功能
  version: 1.0.0
servers:
  - url: http://localhost:8787
    description: 开发环境
paths:
  /admin/shop/list:
    get:
      summary: 获取店铺列表
      tags:
        - 店铺管理
      parameters:
        - name: page
          in: query
          description: 页码
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: 每页数量
          required: false
          schema:
            type: integer
            default: 10
        - name: merchant_id
          in: query
          description: 商户ID
          required: true
          schema:
            type: integer
        - name: name
          in: query
          description: 店铺名称
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 成功获取店铺列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
      security:
        - bearerAuth: []
  /admin/shop/info:
    get:
      summary: 获取店铺详情
      tags:
        - 店铺管理
      parameters:
        - name: id
          in: query
          description: 店铺ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功获取店铺详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDetailResponse'
      security:
        - bearerAuth: []
  /admin/shop/create:
    post:
      summary: 创建店铺
      tags:
        - 店铺管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStoreResponse'
      security:
        - bearerAuth: []
  /admin/shop/update:
    post:
      summary: 更新店铺
      tags:
        - 店铺管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStoreResponse'
      security:
        - bearerAuth: []
  /admin/shop/delete:
    get:
      summary: 删除店铺
      tags:
        - 店铺管理
      parameters:
        - name: id
          in: query
          description: 店铺ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStoreResponse'
      security:
        - bearerAuth: []
components:
  schemas:
    Store:
      type: object
      properties:
        id:
          type: integer
          description: 门店ID
        merchant_id:
          type: integer
          description: 商户ID
        admin_user_id:
          type: integer
          description: 人员ID
        balance:
          type: number
          description: 余额
          format: decimal
        revenue:
          type: number
          description: 营业额
          format: decimal
        name:
          type: string
          description: 门店名称
        address:
          type: string
          description: 门店地址
        contact_phone:
          type: string
          description: 门店联系电话
        status:
          type: integer
          description: 门店状态，1：启用，0：禁用
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        merchant_name:
          type: string
          description: 商户名称
        admin_user_name:
          type: string
          description: 管理员用户名
      required:
        - id
        - merchant_id
        - admin_user_id
        - balance
        - revenue
        - name
        - status
        - created_at
        - updated_at
    StoreListResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data:
          type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/Store'
            pagination:
              type: object
              properties:
                total:
                  type: integer
                per_page:
                  type: integer
                current_page:
                  type: integer
                last_page:
                  type: integer
    StoreDetailResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/Store'
    CreateStoreRequest:
      type: object
      properties:
        merchant_id:
          type: integer
          description: 商户ID
          minimum: 1
        admin_user_id:
          type: integer
          description: 人员ID
          minimum: 1
        name:
          type: string
          description: 门店名称
          maxLength: 255
        address:
          type: string
          description: 门店地址
          maxLength: 500
        contact_phone:
          type: string
          description: 门店联系电话
          pattern: ^1[3-9]\d{9}$
        status:
          type: integer
          description: 门店状态，1：启用，0：禁用
          enum: [0, 1]
          default: 1
      required:
        - merchant_id
        - admin_user_id
        - name
    CreateStoreResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data:
          type: object
          properties:
            id:
              type: integer
              description: 新建的店铺ID
    UpdateStoreRequest:
      type: object
      properties:
        id:
          type: integer
          description: 店铺ID
          minimum: 1
        merchant_id:
          type: integer
          description: 商户ID
          minimum: 1
        admin_user_id:
          type: integer
          description: 人员ID
          minimum: 1
        name:
          type: string
          description: 门店名称
          maxLength: 255
        address:
          type: string
          description: 门店地址
          maxLength: 500
        contact_phone:
          type: string
          description: 门店联系电话
          pattern: ^1[3-9]\d{9}$
        status:
          type: integer
          description: 门店状态，1：启用，0：禁用
          enum: [0, 1]
      required:
        - id
    UpdateStoreResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data: {}
    DeleteStoreResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT